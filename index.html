<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">

<title>Witkowo — agrowoltaika 3D</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  :root {
    --bg: #0b0c0f; --panel: rgba(17, 19, 23, 0.9); --line: #262a31; --line2: #343945;
    --text: #e8e4da; --muted: #8f939c; --accent: #d9ad57; --accent-dim: rgba(217, 173, 87, 0.14);
    --power: #f2c94c; --water: #5fb6e8; --leaf: #8fcf6a;
    --font: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--font); overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #side { top: 14px; left: 14px; bottom: 14px; width: 272px; display: flex; flex-direction: column; overflow: hidden; z-index: 10; }
  #side header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { margin: 4px 0 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  #drawer { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; background: #0d0f12; border: 1px solid var(--line); border-radius: 7px; }
  .seg button { all: unset; text-align: center; padding: 6px 0; border-radius: 5px; cursor: pointer; color: var(--muted); font-weight: 500; transition: background .15s, color .15s; font-variant-numeric: tabular-nums; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--accent-dim); color: var(--accent); }
  .langs { display: inline-grid; grid-template-columns: repeat(2, auto); gap: 1px; padding: 1px; background: #0d0f12; border: 1px solid var(--line); border-radius: 6px; flex: none; }
  .langs button { all: unset; cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
  .langs button:hover { color: var(--text); }
  .langs button.on { background: var(--accent-dim); color: var(--accent); }
  .tog { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; cursor: pointer; user-select: none; }
  .tog input { position: absolute; right: 0; top: 50%; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none; }
  .tog input:disabled + .sw { opacity: 0.45; }
  .tog.busy { color: var(--accent); cursor: progress; }
  .tog .sw { width: 28px; height: 16px; border-radius: 8px; background: #2a2e36; position: relative; transition: background .15s; flex: none; }
  .tog .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #8f939c; transition: transform .15s, background .15s; }
  .tog input:checked + .sw { background: var(--accent-dim); }
  .tog input:checked + .sw::after { transform: translateX(12px); background: var(--accent); }
  .tog .lk { display: flex; align-items: center; gap: 7px; }
  .tog .lk i { width: 10px; height: 3px; border-radius: 2px; flex: none; }
  /* simulation controls */
  .ctl { margin-bottom: 10px; }
  .ctl:last-child { margin-bottom: 0; }
  .ctl .lab { display: flex; align-items: baseline; justify-content: space-between; color: #cfcbc2; margin-bottom: 2px; }
  .ctl .val { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  .ctl .sub { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .row .seg { flex: 1; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) 0 var(--p, 0%), #2a2e36 var(--p, 0%) 100%); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: #2a2e36; }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--accent); border: 2px solid #15120b; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid #15120b; }
  .ibtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 28px; border-radius: 7px; border: 1px solid var(--line2); color: var(--accent); flex: none; }
  .ibtn:hover { border-color: var(--accent); }
  .ibtn.on { background: var(--accent-dim); border-color: rgba(217, 173, 87, 0.5); }
  .seg.two { grid-template-columns: repeat(2, 1fr); }
  li.item.off { color: #5d616a; cursor: default; }
  li.item.off:hover { background: none; color: #5d616a; }
  li.item .sub2 { margin-left: auto; font-size: 11px; color: #5d616a; }
  #hud .wint { display: none; }
  #hud.winter .wint { display: flex; }
  #hud.winter dd.wint { display: block; }
  .tog .fly { cursor: pointer; text-decoration: underline dotted rgba(217, 173, 87, 0.5); text-underline-offset: 3px; }
  .tog .fly:hover { color: var(--accent); }
  #hud .legend { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); gap: 3px; flex-direction: column; }
  #hud.flows .legend { display: flex; }
  #hud .legend span { display: flex; align-items: center; gap: 7px; color: #cfcbc2; }
  #hud .legend i { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  #hud .legend span.off { display: none; }
  /* objects list */
  ul { list-style: none; margin: 0; padding: 0; }
  li.item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; color: #cfcbc2; }
  li.item:hover { background: #1b1e24; color: var(--text); }
  li.item.on { background: var(--accent-dim); color: var(--accent); }
  li.grp { margin: 10px 0 3px; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  li.grp:first-child { margin-top: 0; }
  .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .foot { padding: 10px 16px 14px; color: var(--muted); font-size: 11px; }
  section.langsec { display: none; }
  h1 .short { display: none; }
  /* info panel */
  #panel { top: 14px; right: 14px; width: 330px; max-height: calc(100% - 260px); overflow-y: auto; padding: 18px; transform: translateX(16px); opacity: 0; pointer-events: none; transition: transform .2s ease-out, opacity .2s ease-out; z-index: 12; }
  #panel.open { transform: none; opacity: 1; pointer-events: auto; }
  #panel .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  #panel h3 { margin: 0; font-size: 17px; font-weight: 600; }
  #panel .meta { display: flex; align-items: center; gap: 7px; color: var(--muted); margin-top: 4px; }
  #panel .prop { margin-top: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: #0e1014; font-variant-numeric: tabular-nums; }
  #panel .prop b { display: block; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2px; }
  #panel p { color: #d3cfc6; margin: 12px 0 0; }
  #panel p.est { color: var(--muted); font-size: 11px; }
  .close { all: unset; cursor: pointer; color: var(--muted); font-size: 11px; padding: 3px 8px; border: 1px solid var(--line2); border-radius: 6px; flex: none; }
  .close:hover { color: var(--text); }
  /* HUD */
  #hud { right: 14px; bottom: 14px; width: max-content; min-width: 272px; max-width: 380px; padding: 12px 14px; z-index: 9; }
  #hud h2 { display: flex; justify-content: space-between; margin-bottom: 6px; }
  #hud h2 .clk { color: var(--accent); font-size: 13px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  #hud dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; }
  #hud dt { color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  #hud dt i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  #hud dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  #hud dd small { color: var(--muted); font-weight: 400; margin-left: 3px; }
  #hud .bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: #2a2e36; overflow: hidden; margin: -1px 0 3px; }
  #hud .bar b { display: block; height: 100%; width: 100%; border-radius: 2px; transform: scaleX(0); transform-origin: 0 50%; transition: transform .3s; }
  /* labels / tooltip / hint */
  .label { pointer-events: auto; cursor: pointer; padding: 2px 7px; border-radius: 5px; background: rgba(12, 13, 16, 0.82); border: 1px solid rgba(217, 173, 87, 0.55); color: var(--accent); font: 600 11px/1.2 var(--font); white-space: nowrap; transition: background .12s; }
  .label:hover, .label.on { background: var(--accent); color: #111; }
  #tip { position: fixed; pointer-events: none; padding: 4px 8px; background: rgba(12, 13, 16, 0.92); border: 1px solid var(--line2); border-radius: 6px; font-size: 11px; opacity: 0; transition: opacity .1s; z-index: 15; }
  #hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 7px 12px; font-size: 11px; color: var(--muted); max-width: calc(100% - 640px); min-width: 260px; text-align: center; }
  #hint kbd { font: 600 11px var(--font); color: var(--text); border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; }
  #err { position: fixed; left: 300px; bottom: 14px; max-width: 420px; padding: 10px 12px; color: #ff9a8a; display: none; z-index: 30; }
  .seg button:focus-visible, .langs button:focus-visible, .close:focus-visible, .ibtn:focus-visible, #menuBtn:focus-visible, li.item:focus-visible, .q3d-btn:focus-visible, input[type=range]:focus-visible, .tog input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
  li.item:focus-visible { outline-offset: -2px; }
  /* loading overlay */
  #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 40; pointer-events: none; transition: opacity .35s; }
  #boot.hide { opacity: 0; }
  #boot .card { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: min(420px, calc(100% - 32px)); padding: 20px 22px; text-align: center; background: rgba(13, 14, 17, 0.94); border: 1px solid var(--line2); border-radius: 10px; color: var(--text); font-size: 13px; }
  #boot .ring { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--line2); border-top-color: var(--accent); animation: q3dspin .9s linear infinite; }
  #boot.err .ring { display: none; }
  #boot.err h2 { color: var(--accent); }
  #boot h2 { margin: 0; font-size: 17px; letter-spacing: 0; text-transform: none; color: var(--text); }
  #boot .msg { color: var(--muted); font-size: 13px; }
  #boot .msg:empty, #boot .act:empty { display: none; }
  #boot .act { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .q3d-btn { all: unset; cursor: pointer; padding: 8px 14px; min-height: 20px; border-radius: 7px; border: 1px solid var(--line2); color: var(--text); font-size: 13px; font-weight: 600; }
  .q3d-btn.pri { background: var(--accent); border-color: var(--accent); color: #15120b; }
  .q3d-btn:hover { filter: brightness(1.1); }
  @keyframes q3dspin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #boot .ring { animation-duration: 3s; } }
  #note { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 35; display: flex; align-items: flex-start; gap: 10px; max-width: min(520px, calc(100% - 32px)); padding: 10px 12px 10px 14px; font-size: 13px; }

  /* ---------- mobile / touch ---------- */
  html, body { height: 100dvh; overscroll-behavior: none; }
  #menuBtn, #joy, .grab { display: none; }
  #view canvas { touch-action: none; }
  @media (max-width: 1100px) and (min-width: 821px) { #hint { display: none; } }
  @media (max-width: 820px), (max-height: 500px) {
    :root { --panel: #121418; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); --bar: 52px; }
    html, body { position: fixed; inset: 0; width: 100%; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    .panel { backdrop-filter: none; -webkit-backdrop-filter: none; }
    button, .tog, li.item, a { touch-action: manipulation; }
    #side { top: calc(var(--sat) + 8px); left: calc(var(--sal) + 8px); right: calc(var(--sar) + 8px); bottom: auto; width: auto; height: var(--bar); flex-direction: row; align-items: center; gap: 8px; padding: 0 6px 0 12px; overflow: visible; }
    #side header { padding: 0; border: 0; flex: 1; min-width: 0; }
    #side header .eyebrow, #side header .langs { display: none; }
    #side header h1 { margin: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #side section.viewsec { padding: 0; border: 0; flex: none; }
    .viewsec h2 { display: none; }
    .viewsec .seg button { padding: 0 9px; min-width: 44px; height: 36px; line-height: 36px; font-size: 13px; }
    section.langsec { display: block; }
    h1 .long { display: none; } h1 .short { display: inline; }
    .langsec .langs { display: grid; width: 100%; }
    .langsec .langs button { text-align: center; padding: 0; height: 36px; line-height: 36px; font-size: 13px; }
    #menuBtn { all: unset; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; width: 44px; height: 44px; flex: none; border-radius: 8px; cursor: pointer; }
    #menuBtn span { display: block; width: 18px; height: 2px; border-radius: 1px; background: var(--text); transition: transform .2s, opacity .2s; }
    #menuBtn[aria-expanded="true"] { background: var(--accent-dim); }
    #menuBtn[aria-expanded="true"] span { background: var(--accent); }
    #menuBtn[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    #menuBtn[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    #menuBtn[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
    #drawer, #panel { position: fixed; left: calc(var(--sal)); right: calc(var(--sar)); bottom: 0; top: auto; width: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 14px 14px 0 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; transform: translateY(105%); opacity: 1; transition: transform .26s cubic-bezier(.2, .8, .2, 1), visibility 0s .26s; visibility: hidden; z-index: 20; }
    #drawer { display: block; flex: none; max-height: 72dvh; padding-bottom: calc(var(--sab) + 8px); }
    #drawer.open, #panel.open { transform: none; visibility: visible; transition: transform .26s cubic-bezier(.2, .8, .2, 1); }
    #drawer.drag, #panel.drag { transition: none; }
    #panel { max-height: 60dvh; padding: 0 16px calc(var(--sab) + 16px); pointer-events: auto; }
    .grab { display: block; position: sticky; top: 0; height: 22px; margin: 0 -16px; touch-action: none; cursor: grab; z-index: 1; background: var(--panel); }
    .grab::before { content: ""; position: absolute; left: 50%; top: 8px; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: var(--line2); }
    #drawer .grab { margin: 0; }
    #drawer section { padding: 10px 16px; }
    .tog { min-height: 44px; font-size: 13px; }
    .tog .sw { width: 40px; height: 24px; border-radius: 12px; }
    .tog .sw::after { width: 18px; height: 18px; top: 3px; left: 3px; }
    .tog input:checked + .sw::after { transform: translateX(16px); }
    .seg button { padding: 0; height: 36px; line-height: 36px; }
    .ibtn { width: 44px; height: 38px; }
    input[type=range] { height: 32px; }
    input[type=range]::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -9px; }
    li.item { min-height: 44px; font-size: 13px; }
    .close { min-height: 44px; min-width: 64px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
    .label { pointer-events: none; font-size: 11px; padding: 1px 4px; }
    #tip { display: none; }
    /* HUD: compact strip under the top bar */
    #hud { top: calc(var(--sat) + var(--bar) + 14px); bottom: auto; left: calc(var(--sal) + 8px); right: calc(var(--sar) + 8px); width: auto; padding: 6px 10px; }
    #hud h2, #hud .full, #hud .bar { display: none; }
    #hud dl { grid-template-columns: none; grid-auto-columns: auto; grid-auto-flow: column; grid-template-rows: auto auto; gap: 0 10px; justify-content: space-between; }
    #hud dt { font-size: 11px; }
    #hud.winter dt.full, #hud.winter dd.full, #hud.winter .crop { display: none; } /* winter strip: time, PV, water, greenhouse temp */
    #hud dd { max-width: 30vw; overflow: hidden; text-overflow: ellipsis; }
    #hCrop small { display: none; }
    #hud .legend, #hud.flows .legend { display: none; }
    #hud dd { text-align: left; font-size: 13px; }
    body.sheet #hud { opacity: 0; pointer-events: none; }
    #hint { bottom: calc(var(--sab) + 12px); max-width: calc(100% - 24px); min-width: 0; font-size: 11px; transition: opacity .4s; }
    #hint.fade, body.sheet #hint { opacity: 0; pointer-events: none; }
    #err { left: 8px; right: 8px; bottom: calc(var(--sab) + 8px); max-width: none; }
    #note { top: calc(var(--sat) + var(--bar) + 70px); }
    body.walk.touch #joy { display: block; }
    #joy { position: fixed; left: calc(var(--sal) + 22px); bottom: calc(var(--sab) + 26px); width: 124px; height: 124px; border-radius: 50%; background: rgba(17, 19, 23, 0.55); border: 1px solid var(--line2); touch-action: none; z-index: 8; }
    #joy .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--accent-dim); border: 1.5px solid var(--accent); }
    body.walk.touch #hint { left: auto; right: calc(var(--sar) + 12px); transform: none; max-width: 52%; text-align: right; }
    body.sheet #joy { opacity: 0; pointer-events: none; }
  }
  @media (max-width: 380px) {
    #side { gap: 4px; padding: 0 2px 0 10px; }
    #side header h1 { font-size: 13px; line-height: 1.15; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .viewsec .seg button { min-width: 0; padding: 0 6px; font-size: 11px; }
    #menuBtn { width: 40px; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    :root { --bar: 44px; }
    #side { right: auto; max-width: 60%; }
    .viewsec .seg button { height: 32px; line-height: 32px; }
    #menuBtn { width: 40px; height: 40px; }
    #hud { left: auto; width: 300px; top: calc(var(--sat) + 8px); }
    #drawer, #panel { top: calc(var(--sat) + var(--bar) + 16px); bottom: 8px; max-height: none; border: 1px solid var(--line); border-radius: 12px; transform: translateX(-110%); }
    #drawer { left: calc(var(--sal) + 8px); right: auto; width: 320px; padding-bottom: 8px; }
    #panel { left: auto; right: calc(var(--sar) + 8px); width: min(360px, 48%); transform: translateX(110%); padding-bottom: 16px; }
    #drawer.open, #panel.open { transform: none; }
    .grab { height: 12px; }
    .grab::before { display: none; }
    body.sheet #hud { opacity: 1; }
    #joy { width: 112px; height: 112px; left: calc(var(--sal) + 18px); bottom: calc(var(--sab) + 16px); }
  }
</style>
</head>
<body>
<div id="view"></div>
<aside id="side" class="panel">
  <header>
    <div class="hrow"><span class="eyebrow" data-i18n="app.eyebrow">ZUT · Witkowo</span>
      <div class="langs" role="group" aria-label="Language"><button type="button" data-lang="pl">PL</button><button type="button" data-lang="en">EN</button></div></div>
    <h1><span class="long" data-i18n="app.title">Agrowoltaika Witkowo</span><span class="short">Witkowo</span></h1>
  </header>
  <section class="viewsec"><h2 data-i18n="sec.view">Widok</h2>
