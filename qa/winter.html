<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA winter</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #111317; color: #ddd; font: 13px system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 10px; left: 10px; background: rgba(17,19,23,.9); padding: 10px 12px; border-radius: 8px;
        display: grid; gap: 6px; min-width: 240px; z-index: 2; }
  #ui label { display: flex; gap: 8px; align-items: center; }
  #ui input[type=range] { flex: 1; }
  #info { color: #d9ad57; font-variant-numeric: tabular-nums; white-space: pre; }
  button { background: #2a2e36; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <label>winter <input type="range" id="winter" min="0" max="1" step="0.01" value="1"><span id="winterv">1.00</span></label>
  <label>hour <input type="range" id="hour" min="0" max="24" step="0.1" value="12"><span id="hourv">12.0</span></label>
  <label>sun <input type="range" id="sun" min="0" max="1" step="0.01" value="0.35"><span id="sunv">0.35</span></label>
  <label><input type="checkbox" id="low"> quality low</label>
  <div>
    <button data-v="over">overview</button><button data-v="inside">inside bay</button><button data-v="door">front door</button>
    <button data-v="roof">roof under PV</button><button data-v="back">back</button>
  </div>
  <div id="info">loading...</div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { init as initWinter } from '../lib/winter.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaab8c6);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 500);
const controls = new OrbitControls(camera, renderer.domElement);
const hemi = new THREE.HemisphereLight(0xe4ecf5, 0x6a6458, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2e0, 2.0);
sun.position.set(25, 18, 40);
scene.add(sun);

const state = { hour: 12, sun: 0.35, dayOfSeason: 60, water: 0, speed: 0, quality: 'high', season: 'winter', winter: 1,
  show: { power: true, water: true, labels: true } };
const $ = (id) => document.getElementById(id);
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const gltf = await loader.loadAsync('../model/witkowo.glb');
const root = gltf.scene;
scene.add(root);
const node = (name) => { let h = null; root.traverse(o => { if (!h && o.userData.name === name) h = o; }); return h || root.getObjectByName(name); };
const winter = initWinter({ THREE, scene, root, node, renderer, getCamera: () => camera });
window.__winter = winter; window.__state = state;

const views = {
  over:   [[34, 22, 30], [0, 1, -14]],
  inside: [[5.2, 1.65, -3], [4.2, 1.6, -18]],
  door:   [[5, 2.2, 9], [5, 1.6, 0]],
  roof:   [[1.2, 3.4, -9], [2.3, 4.7, -12]],
  back:   [[-18, 8, -44], [0, 2, -28]],
};
const setView = (k) => { const v = views[k]; camera.position.set(...v[0]); controls.target.set(...v[1]); controls.update(); };
window.__view = setView; setView('over');
document.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => setView(b.dataset.v));
const bind = (id, key, dig) => { $(id).oninput = (e) => { state[key] = +e.target.value; $(id + 'v').textContent = state[key].toFixed(dig); }; };
bind('winter', 'winter', 2); bind('hour', 'hour', 1); bind('sun', 'sun', 2);
$('low').onchange = (e) => state.quality = e.target.checked ? 'low' : 'high';
window.__set = (o) => { Object.assign(state, o); for (const k of ['winter', 'hour', 'sun']) { $(k).value = state[k]; $(k + 'v').textContent = (+state[k]).toFixed(2); } };

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.1, clock.getDelta());
  sun.intensity = 0.4 + 2.2 * state.sun; hemi.intensity = 0.5 + 0.8 * state.sun;
  winter.update(dt, state);
  const i = winter.info();
  $('info').textContent = `outside ${i.outsideC.toFixed(1)} C  inside ${i.insideC.toFixed(1)} C\nfilm ${i.filmDeployed.toFixed(2)}  snow ${i.snowCm.toFixed(1)} cm  colliders ${winter.colliders.length}`;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
