<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA terrain</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #111317; color: #ddd; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; left: 12px; top: 12px; background: rgba(17,19,23,.9); padding: 10px 12px; border-radius: 8px; width: 330px; max-height: calc(100% - 48px); overflow: auto; }
  #ui button { background: #2a2d33; color: #ddd; border: 1px solid #3a3d44; border-radius: 5px; padding: 3px 8px; cursor: pointer; margin: 2px 0; }
  #ui button.on { border-color: #d9ad57; color: #d9ad57; }
  #info { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px; margin-top: 6px; }
  label { display: block; margin-top: 6px; }
  input[type=range] { width: 100%; accent-color: #d9ad57; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <b style="color:#d9ad57">terrain.js</b>
  <div id="sites"></div>
  <div>view: <button data-v="close">pad 150 m</button> <button data-v="mid">500 m</button> <button data-v="far">1.6 km</button></div>
  <label>vertical exaggeration <span id="exv">1</span>x <input id="ex" type="range" min="1" max="5" step="0.5" value="1"></label>
  <label><input id="wire" type="checkbox" checked> wireframe</label>
  <canvas id="prof" width="660" height="300" style="width:330px;height:150px;margin-top:6px;background:#0d0f12;border-radius:4px"></canvas>
  <div style="font-size:11px;color:#999">profiles through the pad: x=0 along z (top), z=-15 along x (bottom); grey natural, amber levelled; +-60 m, pad edges blue</div>
  <div id="info">loading…</div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { init } from '../lib/terrain.js';

const SITES = {
  witkowo: null, // filled from data/geo/site.json
  zakopane: { lat: 49.30, lon: 19.95, rotDeg: 0, name: 'Zakopane (hilly)' },
  kaszuby: { lat: 54.33, lon: 18.17, rotDeg: 0, name: 'Kaszuby (hilly)' },
  kazimierz: { lat: 51.32, lon: 21.95, rotDeg: 0, name: 'Kazimierz Dolny (Wisla valley)' },
  mazowsze: { lat: 52.05, lon: 20.60, rotDeg: 0, name: 'Mazowsze (flat)' },
};
const s0 = await (await fetch('../data/geo/site.json')).json();
SITES.witkowo = { lat: s0.lat, lon: s0.lon, rotDeg: s0.rotDeg, name: 'Witkowo' };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d22);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdde6ff, 0x30281c, 0.9));
const sunL = new THREE.DirectionalLight(0xffffff, 1.8); sunL.position.set(-300, 400, 200); scene.add(sunL);

const terrain = init({ THREE, scene, autoSite: false });
window.__terrain = terrain;
let ex = 1;
const group = new THREE.Group(); scene.add(group);

function colorFor(h, lo, hi, c) {
  const t = Math.min(1, Math.max(0, (h - lo) / Math.max(1e-3, hi - lo)));
  c.setHSL(0.33 - 0.28 * t, 0.45, 0.28 + 0.35 * t);
}
// mesh helper: n x n vertices, side size, centre (cx, cz), sampled by fn
function buildMesh(n, size, cx, cz, fn, lo, hi) {
  const g = new THREE.PlaneGeometry(size, size, n - 1, n - 1); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let k = 0; k < p.count; k++) {
    const x = p.getX(k) + cx, z = p.getZ(k) + cz, h = fn(x, z);
    p.setXYZ(k, x, h * ex, z); colorFor(h, lo, hi, c); col.set([c.r, c.g, c.b], k * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}
const wireMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true, transparent: true, opacity: 0.18 });
function rebuild() {
  group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  group.clear();
  const G = terrain.grid, I = terrain.info();
  let lo = Infinity, hi = -Infinity;
  for (const v of G.heights) { if (v < lo) lo = v; if (v > hi) hi = v; }
  // far: the 1.6 km grid; near: 1 m mesh from heightAt over 200 x 200 m (pushed down 0.05 m under the far one)
  const far = buildMesh(G.w, G.sizeM, G.x0 + G.sizeM / 2, G.z0 + G.sizeM / 2, (x, z) => terrain.heightAt(x, z) - (Math.abs(x) < 100 && Math.abs(z + 15) < 100 ? 6 : 0), lo, hi);
  const near = buildMesh(201, 200, 0, -15, terrain.heightAt, lo, hi);
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: false });
  group.add(new THREE.Mesh(far, mat), new THREE.Mesh(near, mat));
  if (document.querySelector('#wire').checked) {
    const nearW = new THREE.Mesh(near, wireMat); nearW.position.y = 0.02; group.add(nearW);
    group.add(new THREE.Mesh(far, wireMat));
  }
  // pad outline (amber) + natural-ground pad outline (red, shows what was cut/filled)
  const R = terrain.padRect, pts = [], ptsN = [];
  const ring = [[R.x0, R.z0], [R.x1, R.z0], [R.x1, R.z1], [R.x0, R.z1], [R.x0, R.z0]];
  for (let s = 0; s < 4; s++) for (let t = 0; t <= 20; t++) {
    const [ax, az] = ring[s], [bx, bz] = ring[s + 1], x = ax + (bx - ax) * t / 20, z = az + (bz - az) * t / 20;
    pts.push(new THREE.Vector3(x, terrain.heightAt(x, z) * ex + 0.08, z));
    ptsN.push(new THREE.Vector3(x, terrain.naturalHeightAt(x, z) * ex + 0.08, z));
  }
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xd9ad57 })));
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ptsN), new THREE.LineBasicMaterial({ color: 0xff4040 })));
  // north arrow (true north in scene: bearing 0 -> scene direction rotated -rotDeg from -z)
  const b = (I.site?.rotDeg || 0) * Math.PI / 180, nx = -Math.sin(-b) * 0, dir = new THREE.Vector3(Math.sin(-b), 0, -Math.cos(-b));
  const arrow = new THREE.ArrowHelper(dir, new THREE.Vector3(0, 3 + terrain.heightAt(0, 0), 0), 30, 0x4aa3ff, 8, 4);
  group.add(arrow);
  drawProfiles();
  const { levels, ...show } = I;
  document.querySelector('#info').textContent = JSON.stringify(show, null, 1) + '\nlevels: ' + (levels || []).join(' | ') +
    `\ngrid ${G.w}x${G.h} @ ${G.cellM} m, h ${lo.toFixed(1)}..${hi.toFixed(1)} rel. pad`;
}
function drawProfiles() {
  const cv = document.querySelector('#prof'), g = cv.getContext('2d'), W = cv.width, H = cv.height / 2;
  g.clearRect(0, 0, W, cv.height);
  const R = 60, sx = W / (2 * R);
  for (const [row, fn] of [[0, (t) => [0, -15 + t]], [1, (t) => [t, -15]]]) {
    const y0 = row * H, mid = y0 + H / 2;
    let lo = Infinity, hi = -Infinity;
    for (let t = -R; t <= R; t += 0.5) { const [x, z] = fn(t); for (const v of [terrain.heightAt(x, z), terrain.naturalHeightAt(x, z)]) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
    const sy = (H - 16) / Math.max(0.5, hi - lo), c = (lo + hi) / 2;
    const Y = (v) => mid - (v - c) * sy;
    g.strokeStyle = '#333'; g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(W, Y(0)); g.stroke();
    for (const [f, col, lw] of [[terrain.naturalHeightAt, '#8a8f99', 2], [terrain.heightAt, '#d9ad57', 3]]) {
      g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
      for (let t = -R; t <= R; t += 0.5) { const [x, z] = fn(t); const X = (t + R) * sx; t === -R ? g.moveTo(X, Y(f(x, z))) : g.lineTo(X, Y(f(x, z))); }
      g.stroke();
    }
    g.fillStyle = '#aaa'; g.font = '20px system-ui'; g.fillText(row ? 'x (z=-15)' : 'z (x=0)', 8, y0 + 22);
    g.fillText(`${(hi - lo).toFixed(1)} m, vert x${(sy / sx).toFixed(1)}`, W - 190, y0 + 22);
    g.strokeStyle = '#4aa3ff55'; g.lineWidth = 1; for (const e of row ? [-18, 18] : [-21, 21]) { g.beginPath(); g.moveTo((e + R) * sx, y0 + 26); g.lineTo((e + R) * sx, y0 + H - 4); g.stroke(); }
  }
}
const views = {
  close: () => { camera.position.set(70, 45 * Math.max(1, ex * 0.6), 60); controls.target.set(0, 0, -15); },
  mid: () => { camera.position.set(320, 220, 260); controls.target.set(0, 0, -15); },
  far: () => { camera.position.set(900, 700, 900); controls.target.set(0, 0, 0); },
};
document.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => { views[b.dataset.v](); controls.update(); });
const box = document.querySelector('#sites');
for (const [k, s] of Object.entries(SITES)) {
  const b = document.createElement('button'); b.textContent = s.name; b.dataset.site = k;
  b.onclick = () => go(k); box.appendChild(b); box.appendChild(document.createTextNode(' '));
}
async function go(k) {
  document.querySelectorAll('[data-site]').forEach((b) => b.classList.toggle('on', b.dataset.site === k));
  document.querySelector('#info').textContent = 'loading ' + k + '…';
  const t0 = performance.now();
  await terrain.setSite(SITES[k]);
  window.__lastMs = Math.round(performance.now() - t0);
  rebuild();
}
window.__go = go;
document.querySelector('#ex').oninput = (e) => { ex = +e.target.value; document.querySelector('#exv').textContent = ex; rebuild(); };
document.querySelector('#wire').onchange = rebuild;
views.close(); controls.update();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
const q = new URLSearchParams(location.search).get('site') || 'witkowo';
await go(q);
window.__ready = true;
</script>
</body>
</html>
