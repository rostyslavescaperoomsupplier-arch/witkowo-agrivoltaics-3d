<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA water</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #111317; color: #ddd; font: 13px system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 10px; left: 10px; background: rgba(17,19,23,.9); padding: 10px 12px; border-radius: 8px;
        display: grid; gap: 6px; min-width: 240px; z-index: 2; }
  #ui label { display: flex; gap: 8px; align-items: center; }
  #ui input[type=range] { flex: 1; }
  #info { color: #d9ad57; font-variant-numeric: tabular-nums; white-space: pre; }
  button { background: #2a2e36; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <label><input type="checkbox" id="water"> water valve open</label>
  <label><input type="checkbox" id="show" checked> show.water</label>
  <label><input type="checkbox" id="crops" checked> crops visible</label>
  <label>hour <input type="range" id="hour" min="0" max="24" step="0.01" value="6"><span id="hourv">6.00</span></label>
  <label>speed <select id="speed"><option>0</option><option selected>1</option><option>60</option><option>600</option></select></label>
  <div>
    <button data-v="cabinet">cabinet</button><button data-v="header">header</button>
    <button data-v="row">bed row</button><button data-v="top">top</button><button data-v="over">overview</button>
  </div>
  <div id="info">loading…</div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { init as initWater } from '../lib/water.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb4c8);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 500);
camera.position.set(30, 20, 25);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, -12);
scene.add(new THREE.HemisphereLight(0xdfe8f5, 0x4a3b28, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(20, 30, 15);
scene.add(sun);

const state = { hour: 6, sun: 0.7, dayOfSeason: 60, water: 0, speed: 1, quality: 'high',
  show: { power: true, water: true, labels: true } };
const $ = (id) => document.getElementById(id);

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const gltf = await loader.loadAsync('../model/witkowo.glb');
const root = gltf.scene;
scene.add(root);
const node = (name) => { let h = null; root.traverse(o => { if (!h && o.userData.name === name) h = o; }); return h || root.getObjectByName(name); };
const water = initWater({ THREE, scene, root, node, renderer, getCamera: () => camera });
window.__water = water; window.__state = state;

const views = {
  cabinet: [[15.6, 1.4, 1.9], [13.6, 0.2, -0.4]],
  header:  [[6.5, 1.3, 3.2], [7, 0.05, 0.2]],
  row:     [[5.4, 0.9, 1.0], [5.0, 0.0, -4.5]],
  top:     [[4.6, 2.4, -1.6], [4.9, 0.0, -4.6]],
  over:    [[30, 20, 25], [0, 0, -12]],
};
const setView = (k) => { const v = views[k]; camera.position.set(...v[0]); controls.target.set(...v[1]); controls.update(); };
window.__view = setView;
document.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => setView(b.dataset.v));
$('water').onchange = (e) => state.water = e.target.checked ? 1 : 0;
$('show').onchange = (e) => state.show.water = e.target.checked;
$('crops').onchange = (e) => window.__hideCrops(!e.target.checked);
$('hour').oninput = (e) => state.hour = +e.target.value;
$('speed').onchange = (e) => state.speed = +e.target.value;
window.__hideCrops = (h) => root.children.forEach(c => { if ((c.userData.name || c.name).startsWith('Cabbage')) c.visible = !h; });

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  // advance sim hour: speed = sim seconds per real second
  state.hour += dt * state.speed / 3600;
  if (state.hour >= 24) state.hour -= 24;
  $('hour').value = state.hour; $('hourv').textContent = state.hour.toFixed(2);
  water.update(dt, state);
  const i = water.info();
  $('info').textContent = `lpm ${i.lpm.toFixed(1)}  litres today ${i.litresToday.toFixed(0)}\nwetness ${i.wetness.toFixed(2)}  emitters ${i.emitters}  lines ${i.lines}`;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
